<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Geocaching Forums Ireland | Keep Geocaching Ireland</title>
  <meta name="description" content="Chat with Irish geocachers: county corners, puzzle help, beginner questions, gear tips and event meetups.">
  <link rel="canonical" href="https://keepgeocachingireland.github.io/forums.html">
  <meta name="theme-color" content="#0b2e22">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M16%202C9.9%202%205%206.7%205%2012.6%205%2020.4%2016%2030%2016%2030s11-9.6%2011-17.4C27%206.7%2022.1%202%2016%202z%22%20fill%3D%22%23e9a23b%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2212.5%22%20r%3D%224.5%22%20fill%3D%22%230b2e22%22/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Keep Geocaching Ireland">
  <meta property="og:title" content="Geocaching Forums Ireland | Keep Geocaching Ireland">
  <meta property="og:description" content="Chat with Irish geocachers: county corners, puzzle help, beginner questions, gear tips and event meetups.">
  <meta property="og:url" content="https://keepgeocachingireland.github.io/forums.html">
  <meta property="og:image" content="https://keepgeocachingireland.github.io/og-image.png">
  <meta property="og:locale" content="en_IE">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>
  <div class="page-head"><div class="container"><h1>Forums</h1><p>Chat with fellow Irish geocachers.</p></div></div>

  <main class="container" style="padding-top:1.5rem">
    <div id="demoNotice"></div>
    <div class="authbar" id="authbar"></div>
    <div id="view"></div>
  </main>

  <div class="modal-bg" id="authModal">
    <div class="modal">
      <h2 id="authTitle" style="margin-top:0">Log in</h2>
      <div id="authMsg"></div>
      <form id="authForm">
        <div id="userField"><label for="au">Username</label><input id="au" autocomplete="username" maxlength="24"></div>
        <label for="ae">Email</label><input id="ae" type="email" autocomplete="email">
        <label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password" minlength="6">
        <div style="display:flex;gap:.6rem;margin-top:1rem;align-items:center">
          <button class="btn" type="submit" id="authSubmit">Log in</button>
          <button class="btn outline" type="button" id="authSwitch">Need an account?</button>
          <button class="btn outline" type="button" id="authClose" style="margin-left:auto">Close</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-bg" id="reportModal">
    <div class="modal">
      <h2 style="margin-top:0">Report this post</h2>
      <div id="rMsg"></div>
      <form id="reportForm">
        <label for="rReason">What's the problem?</label>
        <textarea id="rReason" required minlength="3" maxlength="500" placeholder="Spam, spoilers, exact coordinates of a hidden cache, abuse, etc."></textarea>
        <div style="display:flex;gap:.6rem;margin-top:1rem">
          <button class="btn" type="submit">Send report</button>
          <button class="btn outline" type="button" id="rClose" style="margin-left:auto">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script src="main.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="forums-data.js"></script>
  <script src="forums.js"></script>
</body>
</html>
